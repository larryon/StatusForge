  /api/v1/api-keys:
    get:
      tags: [API Keys]
      summary: List API keys
      description: Admins see all keys; non-admins see only their own. Requires scope api-keys:read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  apiKeys:
                    type: array
                    items:
                      $ref: "#/components/schemas/APIKey"
    post:
      tags: [API Keys]
      summary: Create an API key
      description: The clear-text key is returned only once in the response. Requires scope api-keys:write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "CI/CD Key"
                expires:
                  type: string
                  format: date-time
                  nullable: true
                  description: ISO 8601 expiry date. Null for never.
                permissions:
                  description: Scope group name or array of scope strings
                  oneOf:
                    - type: string
                      enum: [read-only, read-write, full-access]
                    - type: array
                      items:
                        type: string
      responses:
        "201":
          description: API key created (clear-text key returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                  key:
                    type: string
                    example: "uk1_aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789ab"
                  msg:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"

