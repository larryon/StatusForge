  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get settings
      description: Returns general settings. Requires scope settings:read and admin role.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings key-value pairs
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  settings:
                    type: object
                    additionalProperties: true
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Settings]
      summary: Update settings
      description: Merges provided key-value pairs into settings. Requires scope settings:write and admin role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Key-value pairs to update
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: "API key as Bearer token: Authorization: Bearer uk{id}_{key}"

  parameters:
    MonitorId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Monitor ID
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID
    StatusPageSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Status page URL slug

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions or scope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [ok, msg]
      properties:
        ok:
          type: boolean
          example: false
        msg:
          type: string
          description: Error message

    SuccessMessage:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        msg:
          type: string

    Monitor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          description: "Monitor type (http, keyword, tcp, dns, ping, push, etc.)"
        url:
          type: string
        hostname:
          type: string
        port:
          type: integer
        active:
          type: boolean
        weight:
          type: integer
        interval:
          type: integer
          description: Check interval in seconds
        retryInterval:
          type: integer
        resendInterval:
          type: integer
        maxretries:
          type: integer
        maxredirects:
          type: integer
        timeout:
          type: integer
        keyword:
          type: string
        invertKeyword:
          type: boolean
        upsideDown:
          type: boolean
        ignoreTls:
          type: boolean
        method:
          type: string
        headers:
          type: string
        body:
          type: string
        basic_auth_user:
          type: string
        basic_auth_pass:
          type: string
        pushToken:
          type: string
        parent:
          type: integer
          nullable: true
        description:
          type: string
        dns_resolve_type:
          type: string
        dns_resolve_server:
          type: string
        docker_container:
          type: string
        docker_host:
          type: integer
        proxyId:
          type: integer
        accepted_statuscodes:
          type: array
          items:
            type: string
        create_date:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: object
            properties:
              tag_id:
                type: integer
              name:
                type: string
              color:
                type: string
              value:
                type: string

    MonitorCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: "My Website"
        type:
          type: string
          example: "http"
          description: "http, keyword, tcp, dns, ping, push, grpc, mqtt, etc."
        url:
          type: string
          example: "https://example.com"
        hostname:
          type: string
        port:
          type: integer
        method:
          type: string
          default: "GET"
        interval:
          type: integer
          default: 60
        retryInterval:
          type: integer
          default: 60
        resendInterval:
          type: integer
          default: 0
        maxretries:
          type: integer
          default: 0
        maxredirects:
          type: integer
          default: 10
        timeout:
          type: integer
          default: 48
        keyword:
          type: string
        invertKeyword:
          type: boolean
          default: false
        active:
          type: boolean
          default: true
        upsideDown:
          type: boolean
          default: false
        ignoreTls:
          type: boolean
          default: false
        accepted_statuscodes:
          type: array
          items:
            type: string
          default: ["200-299"]
        headers:
          type: string
        body:
          type: string
        basic_auth_user:
          type: string
        basic_auth_pass:
          type: string
        parent:
          type: integer
          nullable: true
        weight:
          type: integer
          default: 0
        description:
          type: string

    MonitorUpdate:
      type: object
      description: Partial monitor object — only include fields to update
      properties:
        name:
          type: string
        type:
          type: string
        url:
          type: string
        hostname:
          type: string
        port:
          type: integer
        method:
          type: string
        interval:
          type: integer
        active:
          type: boolean
        keyword:
          type: string
        weight:
          type: integer
        description:
          type: string

    Heartbeat:
      type: object
      properties:
        id:
          type: integer
        monitor_id:
          type: integer
        status:
          type: integer
