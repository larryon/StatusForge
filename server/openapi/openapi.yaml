openapi: 3.0.3
info:
  title: Uptime Kuma API
  description: |
    REST API for Uptime Kuma — a self-hosted monitoring tool.

    ## Authentication
    All `/api/v1/*` endpoints require an API key via the `Authorization` header:
    ```
    Authorization: Bearer uk{id}_{key}
    ```
    Or via query parameter: `?apikey=uk{id}_{key}`

    Create API keys in **Settings → API Keys** and assign scopes.

    ## Roles
    - **admin** — Full access to all resources including users and settings.
    - **read-only** — Read-only access to monitors, notifications, status pages, maintenance, tags, uptime, and docker hosts.

    ## Scopes
    API keys have scopes that restrict which endpoints they can access.
    Admin-only scopes (`users:read`, `users:write`, `settings:read`, `settings:write`) are
    automatically stripped from keys owned by non-admin users.

    ## Public Endpoints
    Entry page, push heartbeats, badges, and public status pages do **not** require authentication.
  version: 2.1.3
  license:
    name: MIT
    url: https://github.com/louislam/uptime-kuma/blob/master/LICENSE

servers:
  - url: /
    description: Same-origin (relative to your Uptime Kuma instance)

tags:
  - name: Public
    description: Unauthenticated endpoints
  - name: Badges
    description: SVG badges for status, uptime, ping, and certificate expiry
  - name: Status Page (Public)
    description: Public status page data (unauthenticated)
  - name: Info
    description: API info and version
  - name: Monitors
    description: Monitor CRUD, pause/resume, heartbeats, and uptime
  - name: Notifications
    description: Notification provider CRUD
  - name: Tags
    description: Tag CRUD
  - name: Maintenance
    description: Maintenance window CRUD with monitor and status page assignments
  - name: Status Pages
    description: Status page CRUD and incident management
  - name: Uptime
    description: Uptime summary across all monitors
  - name: Docker Hosts
    description: Docker host CRUD
  - name: Users
    description: User management (admin only)
  - name: API Keys
    description: API key management
  - name: Settings
    description: General settings (admin only)

paths:
  /api/entry-page:
    get:
      tags: [Public]
      summary: Get entry page info
      description: Returns whether the current host maps to a status page or the configured entry page.
      responses:
        "200":
          description: Entry type and optional status page slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [statusPageMatchedDomain, entryPage]
                  statusPageSlug:
                    type: string
                    description: Present when type is statusPageMatchedDomain
                  entryPage:
                    type: string
                    description: Present when type is entryPage

  /api/push/{pushToken}:
    get:
      tags: [Public]
      summary: Push heartbeat (GET)
      description: Report a heartbeat for a push-type monitor.
      parameters:
        - name: pushToken
          in: path
          required: true
          schema:
            type: string
          description: Monitor push token
        - name: msg
          in: query
          schema:
            type: string
            default: "OK"
        - name: ping
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [up, down]
            default: "up"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "404":
          description: Monitor not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [Public]
      summary: Push heartbeat (POST)
      parameters:
        - name: pushToken
          in: path
          required: true
          schema:
            type: string
        - name: msg
          in: query
          schema:
            type: string
            default: "OK"
        - name: ping
          in: query
          schema:
            type: number
        - name: status
          in: query
          schema:
            type: string
            enum: [up, down]
            default: "up"
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
        "404":
          description: Monitor not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/badge/{id}/status:
    get:
      tags: [Badges]
      summary: Status badge SVG
      description: Returns an SVG badge showing the monitor status. Monitor must be in a public group.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Monitor ID
        - name: label
          in: query
          schema:
            type: string
        - name: upLabel
          in: query
          schema:
            type: string
            default: "Up"
        - name: downLabel
          in: query
          schema:
            type: string
            default: "Down"
        - name: style
          in: query
          schema:
            type: string
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema:
                type: string

  /api/badge/{id}/uptime/{duration}:
    get:
      tags: [Badges]
      summary: Uptime percentage badge SVG
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: duration
          in: path
          required: true
          schema:
            type: string
            default: "24h"
          description: "Duration window (e.g. 24h, 7d, 30d)"
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema:
                type: string

  /api/status-page/{slug}:
    get:
      tags: [Status Page (Public)]
      summary: Get status page data
      description: Config, incidents, and monitor list for a published status page.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Status page JSON
          content:
            application/json:
              schema:
                type: object
                description: Contains config, incidentList, monitorList, etc.
        "404":
          description: Status page not found or not published

  /api/status-page/heartbeat/{slug}:
    get:
      tags: [Status Page (Public)]
      summary: Status page heartbeat/polling data
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Heartbeat and uptime data per monitor
          content:
            application/json:
              schema:
                type: object

  /api/status-page/{slug}/incident-history:
    get:
      tags: [Status Page (Public)]
      summary: Incident history
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
          description: Pagination cursor
      responses:
        "200":
          description: List of incidents with optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  incidents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Incident"

  /api/v1/info:
    get:
      tags: [Info]
      summary: API info
      description: Returns version, authenticated user info, and effective scopes.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Info object
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  version:
                    type: string
                    example: "2.1.3"
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      role:
                        type: string
                        enum: [admin, read-only]
                  scopes:
                    type: array
                    items:
                      type: string
                    description: Effective scopes for this API key
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/monitors:
    get:
      tags: [Monitors]
      summary: List all monitors
      description: Requires scope monitors:read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of monitors
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  monitors:
                    type: array
                    items:
                      $ref: "#/components/schemas/Monitor"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Monitors]
      summary: Create a monitor
      description: Requires scope monitors:write and admin role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorCreate"
      responses:
        "201":
          description: Monitor created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  monitorID:
                    type: integer
                  msg:
                    type: string
                    example: "Monitor created."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/monitors/{id}:
    get:
      tags: [Monitors]
      summary: Get monitor by ID
      description: Requires scope monitors:read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
      responses:
        "200":
          description: Monitor details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  monitor:
                    $ref: "#/components/schemas/Monitor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Monitors]
      summary: Update a monitor
      description: Partial update. Requires scope monitors:write and admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorUpdate"
      responses:
        "200":
          description: Monitor updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  monitorID:
                    type: integer
                  msg:
                    type: string
                    example: "Monitor updated."
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      description: Requires scope monitors:write and admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
      responses:
        "200":
          description: Monitor deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/monitors/{id}/pause:
    post:
      tags: [Monitors]
      summary: Pause a monitor
      description: Requires scope monitors:write and admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
      responses:
        "200":
          description: Monitor paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/monitors/{id}/resume:
    post:
      tags: [Monitors]
      summary: Resume a monitor
      description: Requires scope monitors:write and admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
      responses:
        "200":
          description: Monitor resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/monitors/{id}/beats:
    get:
      tags: [Monitors]
      summary: Get heartbeat history
      description: Returns raw heartbeat records. Requires scope uptime:read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
          description: Lookback window in hours
      responses:
        "200":
          description: Heartbeat list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  heartbeats:
                    type: array
                    items:
                      $ref: "#/components/schemas/Heartbeat"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/monitors/{id}/uptime:
    get:
      tags: [Monitors]
      summary: Get monitor uptime
      description: Returns uptime percentage for a single monitor. Requires scope uptime:read.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/MonitorId"
        - name: hours
          in: query
          schema:
            type: integer
            default: 24
          description: Lookback window in hours
      responses:
        "200":
          description: Uptime data
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  uptime:
                    type: number
                    example: 99.98
                  total:
                    type: integer
                    description: Total heartbeats
                  up:
                    type: integer
                    description: Successful heartbeats
                  down:
                    type: integer
                    description: Failed heartbeats
                  hours:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notifications
      description: Returns all notification providers. Config details are stripped. Requires scope notifications:read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Notification list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Notifications]
      summary: Create a notification
      description: Requires scope notifications:write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                  msg:
                    type: string
                    example: "Notification created."
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/notifications/{id}:
    get:
      tags: [Notifications]
      summary: Get notification by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Notification details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  notification:
                    $ref: "#/components/schemas/NotificationSummary"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Notifications]
      summary: Update a notification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "200":
          description: Notification updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                  msg:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Notifications]
      summary: Delete a notification
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Notification deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List tags
      description: Requires scope tags:read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tag list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
    post:
      tags: [Tags]
      summary: Create a tag
      description: Requires scope tags:write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: "Production"
                color:
                  type: string
                  default: "#4B5563"
                  example: "#22C55E"
      responses:
        "201":
          description: Tag created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  tag:
                    $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/tags/{id}:
    get:
      tags: [Tags]
      summary: Get tag by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Tag details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  tag:
                    $ref: "#/components/schemas/Tag"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tags]
      summary: Update a tag
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
      responses:
        "200":
          description: Tag updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  tag:
                    $ref: "#/components/schemas/Tag"
                  msg:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Tags]
      summary: Delete a tag
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Tag deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/maintenance:
    get:
      tags: [Maintenance]
      summary: List maintenance windows
      description: Requires scope maintenance:read.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Maintenance list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  maintenance:
                    type: array
                    items:
                      $ref: "#/components/schemas/Maintenance"
    post:
      tags: [Maintenance]
      summary: Create a maintenance window
      description: Requires scope maintenance:write.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceCreate"
      responses:
        "201":
          description: Maintenance created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                  msg:
                    type: string
                    example: "Maintenance created."
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/maintenance/{id}:
    get:
      tags: [Maintenance]
      summary: Get maintenance by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Maintenance details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  maintenance:
                    $ref: "#/components/schemas/Maintenance"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Maintenance]
      summary: Update a maintenance window
      description: Requires scope maintenance:write and admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceCreate"
      responses:
        "200":
          description: Maintenance updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  id:
                    type: integer
                  msg:
                    type: string
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Maintenance]
      summary: Delete a maintenance window
      description: Requires scope maintenance:write and admin role.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Maintenance deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/maintenance/{id}/pause:
    post:
      tags: [Maintenance]
      summary: Pause a maintenance window
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Maintenance paused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/maintenance/{id}/resume:
    post:
      tags: [Maintenance]
      summary: Resume a maintenance window
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Maintenance resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/maintenance/{id}/monitors:
    get:
      tags: [Maintenance]
      summary: Get monitors assigned to maintenance
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Monitor ID list
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  monitors:
                    type: array
                    items:
                      type: integer
                    description: Array of monitor IDs
    put:
      tags: [Maintenance]
      summary: Set monitors for maintenance
      description: Replaces the current monitor list. Requires scope maintenance:write.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitors]
              properties:
                monitors:
                  type: array
                  items:
                    type: integer
                  description: Array of monitor IDs
      responses:
        "200":
