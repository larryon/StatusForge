      security:
        - bearerAuth: []
      responses:
        "200":
          description: Scope information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  scopes:
                    type: array
                    items:
                      type: string
                  scopeGroups:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  roleScopesForCurrentUser:
                    type: array
                    items:
                      type: string

  /api/v1/api-keys/{id}:
    delete:
      tags: [API Keys]
      summary: Delete an API key
      description: Admins can delete any key; non-admins only their own. Requires scope api-keys:write.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: API key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessage"
