openapi: 3.0.3
info:
  title: Uptime Kuma API
  description: |
    HTTP API for Uptime Kuma: monitors, status pages, badges, and push heartbeats.
    - **Public** and **Status Page** routes are unauthenticated.
    - **REST API v1** (`/api/v1/*`) requires an API key via `Authorization: Bearer <key>` or query `?apikey=<key>`.
    See Settings → API Keys to create a key and assign scopes (e.g. `monitors:read`, `monitors:write`).
  version: 2.1.3

servers:
  - url: /
    description: Same-origin (relative to your Uptime Kuma instance)

tags:
  - name: Public
    description: Unauthenticated endpoints
  - name: Badges
    description: SVG badges for status, uptime, ping, cert expiry
  - name: Status Page
    description: Public status page data
  - name: Monitors
    description: Monitor CRUD and heartbeat data (API key required)
  - name: Info
    description: API info (API key required)

paths:
  /api/entry-page:
    get:
      tags: [Public]
      summary: Get entry page info
      description: Returns whether the current host maps to a status page or the configured entry page.
      responses:
        "200":
          description: Entry type and optional status page slug
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [statusPageMatchedDomain, entryPage]
                  statusPageSlug:
                    type: string
                    description: Present when type is statusPageMatchedDomain
                  entryPage:
                    type: string
                    description: Present when type is entryPage (e.g. dashboard, statusPage-xxx)

  /api/push/{pushToken}:
    get:
      tags: [Public]
      summary: Push heartbeat (GET)
      description: Report a heartbeat for a push-type monitor. Also supports POST with same query params.
      parameters:
        - name: pushToken
          in: path
          required: true
          schema: { type: string }
          description: Monitor push token (from monitor settings)
        - name: msg
          in: query
          schema: { type: string, default: "OK" }
        - name: ping
          in: query
          schema: { type: number }
        - name: status
          in: query
          schema: { type: string, enum: [up, down], default: "up" }
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: Monitor not found or not active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [Public]
      summary: Push heartbeat (POST)
      parameters:
        - name: pushToken
          in: path
          required: true
          schema: { type: string }
        - name: msg
          in: query
          schema: { type: string, default: "OK" }
        - name: ping
          in: query
          schema: { type: number }
        - name: status
          in: query
          schema: { type: string, enum: [up, down], default: "up" }
      responses:
        "200":
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        "404":
          description: Monitor not found or not active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/badge/{id}/status:
    get:
      tags: [Badges]
      summary: Status badge SVG
      description: Returns an SVG badge for the monitor status (Up/Down/Pending/Maintenance). Monitor must be in a public group.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Monitor ID
        - name: label
          in: query
          schema: { type: string }
        - name: upLabel
          in: query
          schema: { type: string, default: "Up" }
        - name: downLabel
          in: query
          schema: { type: string, default: "Down" }
        - name: style
          in: query
          schema: { type: string }
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema: { type: string }

  /api/badge/{id}/uptime/{duration}:
    get:
      tags: [Badges]
      summary: Uptime percentage badge SVG
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: duration
          in: path
          schema: { type: string, default: "24h" }
          description: e.g. 24h, 7d, 30d
      responses:
        "200":
          description: SVG image
          content:
            image/svg+xml:
              schema: { type: string }

  /api/status-page/{slug}:
    get:
      tags: [Status Page]
      summary: Get status page data
      description: Config, incidents, and monitor list for a published status page.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status page JSON
          content:
            application/json:
              schema:
                type: object
                description: Contains config, incidentList, monitorList, etc.
        "404":
          description: Status page not found or not published

  /api/status-page/heartbeat/{slug}:
    get:
      tags: [Status Page]
      summary: Status page heartbeat/polling data
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Heartbeat and uptime data per monitor
          content:
            application/json:
              schema: { type: object }

  /api/status-page/{slug}/incident-history:
    get:
      tags: [Status Page]
      summary: Incident history
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
          description: Pagination cursor
      responses:
        "200":
          description: List of incidents with optional next cursor
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  incidents: { type: array }

  /api/v1/info:
    get:
      tags: [Info]
      summary: API info
      description: Returns version and capabilities. Requires API key (any scope).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Info object
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      description: Requires API key with scope `monitors:read`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: List of monitors accessible by the API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  monitors:
                    type: array
                    items: { $ref: "#/components/schemas/Monitor" }
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Insufficient scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/monitors/{id}:
    get:
      tags: [Monitors]
      summary: Get monitor by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Monitor details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  monitor: { $ref: "#/components/schemas/Monitor" }
        "400":
          description: Invalid monitor ID
        "403":
          description: Access denied
        "404":
          description: Monitor not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: "API key as Bearer token in Authorization header, or use query parameter apikey"
  schemas:
    Error:
      type: object
      required: [ok, msg]
      properties:
        ok:
          type: boolean
          example: false
        msg:
          type: string
          description: Error message
    Monitor:
      type: object
      description: Monitor (subset of full response)
      properties:
        id: { type: integer }
        name: { type: string }
        active: { type: boolean }
        url: { type: string }
        type: { type: string }
        weight: { type: integer }
        create_date: { type: string }
